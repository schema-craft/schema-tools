on:
  push:
    tags:
      - 'v[0-9]+.*'

name: Release

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: true # todo: change to false
          prerelease: true

  crates:
    name: Publish schematools on crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo publish -p schematools --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - run: cargo publish -p schematools-cli --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

  release_assets:
    name: Release assets
    needs: create_release
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            short: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            short: linux-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            short: darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            short: windows-amd64
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            short: windows-arm64
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            short: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.config.target }}
          default: true
          override: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.config.target }}

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/${{ matrix.config.target }}/release/schematools-cli${{ matrix.config.extension }} dist/schematools-${{ matrix.config.short }}${{ matrix.config.extension }}

      - name: Strip binary
        run: strip dist/schematools-${{ matrix.config.short }}${{ matrix.config.extension }}

      - name: Create tarball
        run: tar -czf dist/schematools-${{ matrix.config.short }}.tar.gz -C ./dist schematools-${{ matrix.config.short }}${{ matrix.config.extension }}

      - name: Upload binary artifact
        if: matrix.config.short == 'linux-amd64' || matrix.config.short == 'linux-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: schematools-${{ matrix.config.short }}
          path: dist/schematools-${{ matrix.config.short }}${{ matrix.config.extension }}

      # upload files
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_name: schematools-${{ matrix.config.short }}.tar.gz
          asset_path: ./dist/schematools-${{ matrix.config.short }}.tar.gz
          asset_content_type: application/tar+gzip

  docker:
    name: Build and push Docker image
    needs: release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: schematools-linux-*
          merge-multiple: true
          path: ./dist

      - name: Rename binaries for Docker context
        run: |
          mv ./dist/schematools-linux-amd64 ./dist/schematools-cli-amd64
          mv ./dist/schematools-linux-arm64 ./dist/schematools-cli-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
